<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#212121">
    <title>Next Break</title>

    <meta name="description" content="School holiday and break countdown for South Tyrol (Südtirol). Track remaining school days until all upcoming breaks, holidays and days off.">
    <link rel="canonical" href="https://nextbreak.julianjesacher.org/">

    <meta name="google-site-verification" content="xfJ86e5oDhUnMWvr9J0Q5yU2USORDvI5YrN6NZCBm6g" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" sizes="any">
    <link rel="icon" type="image/png" href="assets/icons/favicon.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
    </div>

    <div id="app-container" hidden>
        <header id="top-bar">
            <div class="inner">
                <button id="about-button" class="icon-button" aria-label="About this app">
                    <svg viewBox="0 0 24 24">
                        <mask id="info-mask">
                            <circle cx="12" cy="12" r="10" fill="white"/>
                            <circle cx="12" cy="8" r="1.3" fill="black"/>
                            <rect x="10.8" y="10.5" width="2.4" height="7" rx="1.2" fill="black"/>
                        </mask>
                        <circle cx="12" cy="12" r="10" fill="currentColor" mask="url(#info-mask)"/>
                    </svg>
                </button>
                <h1 id="title" translate="no">Next Break</h1>
                <p id="status-text">Test</p>
            </div>
        </header>

        <div id="app">
            <main id="content">
                <div id="pager-section">
                    <div id="pager-wrapper">
                        <button id="pager-prev" class="pager-arrow" aria-label="Previous">‹</button>

                        <div id="pager">
                            <div id="pager-track">
                                <div class="pager-page">
                                    <p class="holiday-countdown">12</p>
                                    <p class="holiday-label">school days until<br>autumn break</p>
                                </div>
                                <div class="pager-page">
                                    <p class="holiday-countdown">35</p>
                                    <p class="holiday-label">school days until<br>winter break</p>
                                </div>
                                <div class="pager-page">
                                    <p class="holiday-countdown">57</p>
                                    <p class="holiday-label">school days until<br>carnival break</p>
                                </div>
                            </div>
                        </div>

                        <button id="pager-next" class="pager-arrow" aria-label="Next">›</button>
                    </div>

                    <div id="pager-pills">

                    </div>
                </div>

                <p id="next-day-off">Next day off in 3 days</p>
            </main>

            <footer id="bottom-bar">
                <div class="inner" id="bottom-bar-inner">
                    <p id="school-days-left">20 school days left</p>
                    <div id="progress-bar">
                        <div id="progress-bar-fill"></div>
                        <p id="progress-bar-label">42%</p>
                    </div>
                </div>
            </footer>
        </div>

        <div id="summer-screen" hidden>
            <h1>It's summer!</h1>
            <p>Relax, bro.</p>
        </div>
        
        <div id="error-screen" hidden>
            <div id="error-icon" aria-hidden="true"></div>
            <h1 id="error-title"></h1>
            <p id="error-message"></p>
            <button id="error-retry" hidden>Try again</button>
        </div>
        <div id="about-overlay" class="overlay" hidden>
            <div id="about-dialog" role="dialog" aria-modal="true" aria-labelledby="about-title">
                <button id="about-close" class="icon-button" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>

                <h2 id="about-title">About this page</h2>
                <p id="about-developer">Created by Julian Jesacher</p>
                <p id="about-version"></p>

                <div id="about-buttons">
                    <a id="about-app-download" class="link-button" href="#" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        <span>Download the app</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                            <polyline points="15 3 21 3 21 9"/>
                            <line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                    </a>

                    <a id="about-source-code" class="link-button" href="#" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 18 22 12 16 6"/>
                            <polyline points="8 6 2 12 8 18"/>
                        </svg>
                        <span>View source code</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                            <polyline points="15 3 21 3 21 9"/>
                            <line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
