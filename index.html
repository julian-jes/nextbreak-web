<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Break</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header id="top-bar">
            <div class="inner">
                <h1 id="title">Next Break</h1>
                <p id="status-text">Test</p>
            </div>
        </header>

        <main id="content">
            <div id="pager">
                <div class="pager-page">
                    <p id="holiday-countdown">12</p>
                    <p id="holiday-label">school days until<br>autumn break</p>
                </div>
            </div>

            <p id="next-day-off">Next day off in 3 days</p>
        </main>

        <footer id="bottom-bar">
            <div class="inner" id="bottom-bar-inner">
                <p id="school-days-left">20 school days left</p>
                <div id="progress-bar">
                    <div id="progress-bar-fill"></div>
                    <p id="progress-bar-label">42%</p>
                </div>
            </div>
        </footer>
    </div>

    <div id="summer-screen" hidden>
        <h1>It's summer!</h1>
        <p>Relax, bro.</p>
    </div>
    
    <div id="error-screen" hidden>
        <h1>No data available</h1>
        <p>Unable to load data. <br>Please try again.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
